<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap');

  :root{
    --frame:#14161c;
    --frame-raised:#1b1e26;
    --frame-border:#262a34;
    --muted:#8a92a6;
    --muted-dim:#5b6070;
    --paper:#f6f1e4;
    --paper-line:#e4dcc7;
    --paper-edge:#eae3d1;
    --ink:#2b2a28;
    --ink-soft:#5c574c;
    --accent:#3654e0;
    --accent-soft:rgba(54,84,224,0.14);
    --accent-line:rgba(54,84,224,0.35);
    --danger:#c2445a;
    --sidebar-w:300px;
    --note-color:#3654e0;
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--frame);
    color:var(--muted);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }

  .app{
    display:grid;
    grid-template-columns:var(--sidebar-w) 1fr;
    height:100vh;
  }

  /* ---------- Sidebar ---------- */
  .sidebar{
    background:var(--frame);
    border-right:1px solid var(--frame-border);
    display:flex;
    flex-direction:column;
    position:relative;
    min-width:0;
  }

  /* spiral binding signature */
  .spine{
    position:absolute;
    top:0; right:-1px; bottom:0;
    width:1px;
  }
  .spine::before{
    content:"";
    position:absolute;
    top:18px; bottom:18px; right:-6px;
    width:12px;
    background-image:radial-gradient(circle at 6px 6px, var(--frame) 3.4px, var(--frame-border) 3.6px, var(--frame-border) 4.2px, transparent 4.4px);
    background-size:12px 26px;
    background-repeat:repeat-y;
    opacity:.9;
  }

  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:22px 22px 16px;
  }
  .brand-mark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:20px;
    letter-spacing:-0.01em;
    background:linear-gradient(100deg,#f1efe9 10%,#9b5de5 60%,#f15ba5 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .brand-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted-dim);
  }

  .toolbar{
    padding:0 16px 14px;
    display:flex;
    gap:8px;
  }
  .search-wrap{
    position:relative;
    flex:1;
  }
  .search-wrap svg{
    position:absolute;
    left:10px; top:50%;
    transform:translateY(-50%);
    color:var(--muted-dim);
  }
  #search{
    width:100%;
    background:var(--frame-raised);
    border:1px solid var(--frame-border);
    border-radius:8px;
    padding:8px 10px 8px 32px;
    color:#e8e6df;
    font-family:'Inter', sans-serif;
    font-size:13px;
    outline:none;
    transition:border-color .15s ease;
  }
  #search::placeholder{ color:var(--muted-dim); }
  #search:focus{ border-color:var(--accent-line); }

  #newNoteBtn{
    width:34px; height:34px;
    border-radius:8px;
    border:1px solid var(--frame-border);
    background:linear-gradient(135deg,#3654e0,#9b5de5 55%,#f15ba5);
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition:filter .15s ease, transform .1s ease, box-shadow .15s ease;
    flex-shrink:0;
    box-shadow:0 2px 10px -2px rgba(155,93,229,0.5);
  }
  #newNoteBtn:hover{ filter:brightness(1.12); box-shadow:0 4px 16px -2px rgba(155,93,229,0.7); }
  #newNoteBtn:active{ transform:scale(.94); }

  .note-list{
    flex:1;
    overflow-y:auto;
    padding:4px 10px 14px;
  }
  .note-list::-webkit-scrollbar{ width:8px; }
  .note-list::-webkit-scrollbar-thumb{ background:var(--frame-raised); border-radius:4px; }

  .note-item{
    padding:11px 12px 11px 14px;
    border-radius:9px;
    cursor:pointer;
    margin-bottom:2px;
    border:1px solid transparent;
    border-left:3px solid color-mix(in srgb, var(--note-color) 55%, transparent);
    transition:background .12s ease, border-color .12s ease;
  }
  .note-item:hover{ background:var(--frame-raised); }
  .note-item.active{
    background:color-mix(in srgb, var(--note-color) 16%, var(--frame));
    border-color:color-mix(in srgb, var(--note-color) 45%, transparent);
    border-left-color:var(--note-color);
  }
  .note-item-title{
    font-family:'Fraunces', serif;
    font-size:14.5px;
    font-weight:500;
    color:#eeece5;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:3px;
    display:flex;
    align-items:center;
    gap:7px;
  }
  .note-item-title .dot{
    width:7px; height:7px;
    border-radius:50%;
    background:var(--note-color);
    flex-shrink:0;
    box-shadow:0 0 0 3px color-mix(in srgb, var(--note-color) 25%, transparent);
  }
  .note-item.active .note-item-title{ color:#fff; }
  .note-item-snippet{
    font-size:12px;
    color:var(--muted-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-bottom:5px;
  }
  .note-item-meta{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--muted-dim);
  }

  .empty-list{
    padding:30px 16px;
    text-align:center;
    color:var(--muted-dim);
    font-size:12.5px;
    line-height:1.6;
  }

  /* ---------- Editor / Paper ---------- */
  .editor-frame{
    background:var(--frame);
    display:flex;
    flex-direction:column;
    min-width:0;
    position:relative;
  }

  .editor-topbar{
    display:flex;
    align-items:center;
    justify-content:flex-end;
    gap:14px;
    padding:16px 34px 0;
    height:20px;
  }
  .autosave{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--muted-dim);
  }
  .autosave-dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--muted-dim);
    transition:background .2s ease;
  }
  .autosave-dot.saving{
    background:var(--note-color);
    animation:pulse 1s ease infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.4; transform:scale(1.6); }
  }
  #deleteBtn{
    background:none;
    border:none;
    color:var(--muted-dim);
    cursor:pointer;
    padding:5px 9px;
    border-radius:6px;
    font-family:'Inter', sans-serif;
    font-size:12px;
    display:flex;
    align-items:center;
    gap:5px;
    transition:color .15s ease, background .15s ease;
  }
  #deleteBtn:hover{ color:var(--danger); background:rgba(194,68,90,0.1); }
  #deleteBtn.confirm{ color:#fff; background:var(--danger); }

  .paper-wrap{
    flex:1;
    display:flex;
    justify-content:center;
    padding:18px 34px 34px;
    min-height:0;
  }
  .paper{
    background:var(--paper);
    width:100%;
    max-width:760px;
    border-radius:10px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    padding:44px 52px 30px;
    min-height:0;
    position:relative;
    background-image:repeating-linear-gradient(var(--paper) 0px, var(--paper) 33px, var(--paper-line) 34px);
    background-attachment:local;
  }
  .paper::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:38px;
    width:1px;
    background:color-mix(in srgb, var(--note-color) 45%, transparent);
  }

  #titleInput{
    background:none;
    border:none;
    outline:none;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:30px;
    color:var(--ink);
    padding-bottom:10px;
    margin-bottom:4px;
    letter-spacing:-0.01em;
    caret-color:var(--note-color);
    border-bottom:2px solid color-mix(in srgb, var(--note-color) 30%, transparent);
  }
  #titleInput::placeholder{ color:#b9b1a0; }

  .paper-meta{
    display:flex;
    align-items:center;
    justify-content:space-between;
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    color:var(--ink-soft);
    margin-bottom:18px;
    opacity:.85;
  }

  .swatches{
    display:flex;
    gap:7px;
  }
  .swatch{
    width:15px; height:15px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    transition:transform .12s ease, border-color .12s ease;
  }
  .swatch:hover{ transform:scale(1.15); }
  .swatch.active{ border-color:var(--ink); transform:scale(1.15); }

  #bodyInput{
    flex:1;
    background:none;
    border:none;
    outline:none;
    resize:none;
    font-family:'Source Serif 4', serif;
    font-size:16.5px;
    line-height:34px;
    color:var(--ink);
    min-height:0;
    caret-color:var(--note-color);
  }
  #bodyInput::placeholder{ color:#b9b1a0; }

  .paper-footer{
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    color:var(--ink-soft);
    opacity:.65;
  }

  .empty-editor{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:14px;
    color:var(--muted-dim);
  }
  .empty-editor svg{ opacity:.5; }
  .empty-editor-title{
    font-family:'Fraunces', serif;
    font-size:20px;
    color:#c8c6bd;
  }
  .empty-editor-sub{ font-size:13px; }
  .empty-editor button{
    margin-top:6px;
    background:var(--accent);
    border:none;
    color:#fff;
    padding:9px 18px;
    border-radius:8px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition:transform .1s ease, filter .15s ease;
  }
  .empty-editor button:hover{ filter:brightness(1.1); }
  .empty-editor button:active{ transform:scale(.97); }

  .hidden{ display:none !important; }

  /* mobile */
  .menu-toggle{ display:none; }
  @media (max-width:760px){
    .app{ grid-template-columns:1fr; }
    .sidebar{
      position:fixed;
      inset:0 20% 0 0;
      z-index:10;
      transform:translateX(-100%);
      transition:transform .2s ease;
      box-shadow:20px 0 40px rgba(0,0,0,0.4);
    }
    .sidebar.open{ transform:translateX(0); }
    .menu-toggle{
      display:flex;
      align-items:center;
      justify-content:center;
      width:34px; height:34px;
      border-radius:8px;
      border:1px solid var(--frame-border);
      background:var(--frame-raised);
      color:#e8e6df;
      cursor:pointer;
      margin-right:auto;
    }
    .paper-wrap{ padding:14px 14px 20px; }
    .paper{ padding:30px 26px 20px; }
    #titleInput{ font-size:24px; }
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="spine"></div>
    <div class="brand">
      <span class="brand-mark">Notepad</span>
      <span class="brand-count" id="noteCount">0 notes</span>
    </div>
    <div class="toolbar">
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="text" placeholder="Search notes">
      </div>
      <button id="newNoteBtn" title="New note (Ctrl/Cmd+N)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </button>
    </div>
    <div class="note-list" id="noteList"></div>
  </aside>

  <main class="editor-frame">
    <div class="editor-topbar">
      <button class="menu-toggle" id="menuToggle">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="autosave" id="autosave">
        <span class="autosave-dot" id="autosaveDot"></span>
        <span id="autosaveText">saved</span>
      </div>
      <button id="deleteBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
        <span id="deleteLabel">Delete</span>
      </button>
    </div>

    <div class="paper-wrap" id="paperWrap">
      <div class="paper hidden" id="paper">
        <input id="titleInput" placeholder="Untitled">
        <div class="paper-meta">
          <span id="paperMeta">—</span>
          <div class="swatches" id="swatches"></div>
        </div>
        <textarea id="bodyInput" placeholder="Start writing..."></textarea>
        <div class="paper-footer">
          <span id="wordCount">0 words</span>
          <span id="charCount">0 characters</span>
        </div>
      </div>

      <div class="empty-editor" id="emptyEditor">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>
        <div class="empty-editor-title">No note selected</div>
        <div class="empty-editor-sub">Pick a note from the list, or start a fresh page.</div>
        <button id="emptyNewBtn">New note</button>
      </div>
    </div>
  </main>
</div>

<script>
(function(){
  const STORAGE_KEY = 'notepad-notes-v1';
  const PALETTE = ['#3654e0','#9b5de5','#f15ba5','#f5a623','#2dd4bf','#8bc34a','#e05353'];
  let notes = [];
  let activeId = null;
  let saveTimer = null;
  let deleteConfirmTimer = null;
  let colorCursor = 0;

  function nextColor(){
    const c = PALETTE[colorCursor % PALETTE.length];
    colorCursor++;
    return c;
  }

  const noteList = document.getElementById('noteList');
  const noteCount = document.getElementById('noteCount');
  const search = document.getElementById('search');
  const titleInput = document.getElementById('titleInput');
  const bodyInput = document.getElementById('bodyInput');
  const paper = document.getElementById('paper');
  const emptyEditor = document.getElementById('emptyEditor');
  const paperMeta = document.getElementById('paperMeta');
  const wordCount = document.getElementById('wordCount');
  const charCount = document.getElementById('charCount');
  const autosaveDot = document.getElementById('autosaveDot');
  const autosaveText = document.getElementById('autosaveText');
  const deleteBtn = document.getElementById('deleteBtn');
  const deleteLabel = document.getElementById('deleteLabel');
  const sidebar = document.getElementById('sidebar');

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function relTime(ts){
    const diff = Date.now() - ts;
    const min = Math.floor(diff/60000);
    if(min < 1) return 'just now';
    if(min < 60) return min + 'm ago';
    const hr = Math.floor(min/60);
    if(hr < 24) return hr + 'h ago';
    const day = Math.floor(hr/24);
    if(day < 7) return day + 'd ago';
    return new Date(ts).toLocaleDateString(undefined,{month:'short', day:'numeric'});
  }

  async function loadNotes(){
    try{
      const res = await window.storage.get(STORAGE_KEY, false);
      notes = res && res.value ? JSON.parse(res.value) : [];
    }catch(e){
      notes = [];
    }
    if(notes.length === 0){
      notes.push({
        id: uid(),
        title: 'Welcome',
        body: 'This is your notepad.\n\nEverything you write here saves automatically and will be here next time you open this app.\n\nUse the + button to start a new note, the color dots to tag it, and the search bar to find old ones.',
        updatedAt: Date.now(),
        color: nextColor()
      });
      persist();
    }
    notes.forEach(n=>{ if(!n.color){ n.color = nextColor(); } });
    notes.sort((a,b)=> b.updatedAt - a.updatedAt);
    activeId = notes[0].id;
    renderList();
    renderEditor();
  }

  async function persist(showIndicator){
    if(showIndicator){
      autosaveDot.classList.add('saving');
      autosaveText.textContent = 'saving';
    }
    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(notes), false);
    }catch(e){}
    if(showIndicator){
      setTimeout(()=>{
        autosaveDot.classList.remove('saving');
        autosaveText.textContent = 'saved';
      }, 350);
    }
  }

  function renderList(){
    const q = search.value.trim().toLowerCase();
    const filtered = notes
      .slice()
      .sort((a,b)=> b.updatedAt - a.updatedAt)
      .filter(n => !q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q));

    noteCount.textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
    noteList.innerHTML = '';

    if(filtered.length === 0){
      const div = document.createElement('div');
      div.className = 'empty-list';
      div.textContent = q ? 'No notes match your search.' : 'No notes yet.';
      noteList.appendChild(div);
      return;
    }

    filtered.forEach(n=>{
      const item = document.createElement('div');
      item.className = 'note-item' + (n.id === activeId ? ' active' : '');
      item.style.setProperty('--note-color', n.color || PALETTE[0]);
      const title = document.createElement('div');
      title.className = 'note-item-title';
      const dot = document.createElement('span');
      dot.className = 'dot';
      const titleText = document.createElement('span');
      titleText.textContent = n.title.trim() || 'Untitled';
      title.appendChild(dot);
      title.appendChild(titleText);
      const snippet = document.createElement('div');
      snippet.className = 'note-item-snippet';
      snippet.textContent = n.body.trim().slice(0,80) || 'No additional text';
      const meta = document.createElement('div');
      meta.className = 'note-item-meta';
      meta.textContent = relTime(n.updatedAt);
      item.appendChild(title);
      item.appendChild(snippet);
      item.appendChild(meta);
      item.addEventListener('click', ()=>{
        activeId = n.id;
        renderList();
        renderEditor();
        if(window.innerWidth <= 760) sidebar.classList.remove('open');
      });
      noteList.appendChild(item);
    });
  }

  function updateCounts(){
    const text = bodyInput.value.trim();
    const words = text ? text.split(/\s+/).length : 0;
    wordCount.textContent = words + (words === 1 ? ' word' : ' words');
    charCount.textContent = bodyInput.value.length + (bodyInput.value.length === 1 ? ' character' : ' characters');
  }

  function renderEditor(){
    const note = notes.find(n=>n.id === activeId);
    if(!note){
      paper.classList.add('hidden');
      emptyEditor.classList.remove('hidden');
      return;
    }
    paper.classList.remove('hidden');
    emptyEditor.classList.add('hidden');
    titleInput.value = note.title;
    bodyInput.value = note.body;
    paperMeta.textContent = 'Last edited ' + relTime(note.updatedAt);
    document.documentElement.style.setProperty('--note-color', note.color || PALETTE[0]);
    renderSwatches(note);
    updateCounts();
  }

  function renderSwatches(note){
    const wrap = document.getElementById('swatches');
    wrap.innerHTML = '';
    PALETTE.forEach(c=>{
      const sw = document.createElement('div');
      sw.className = 'swatch' + (note.color === c ? ' active' : '');
      sw.style.background = c;
      sw.title = 'Set note color';
      sw.addEventListener('click', ()=>{
        note.color = c;
        note.updatedAt = Date.now();
        document.documentElement.style.setProperty('--note-color', c);
        renderSwatches(note);
        renderList();
        persist(true);
      });
      wrap.appendChild(sw);
    });
  }

  function scheduleSave(){
    const note = notes.find(n=>n.id === activeId);
    if(!note) return;
    note.title = titleInput.value;
    note.body = bodyInput.value;
    note.updatedAt = Date.now();
    updateCounts();
    renderList();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=> persist(true), 500);
  }

  function newNote(){
    const note = { id: uid(), title: '', body: '', updatedAt: Date.now(), color: nextColor() };
    notes.unshift(note);
    activeId = note.id;
    renderList();
    renderEditor();
    persist(true);
    titleInput.focus();
    if(window.innerWidth <= 760) sidebar.classList.remove('open');
  }

  function deleteActive(){
    const idx = notes.findIndex(n=>n.id === activeId);
    if(idx === -1) return;
    notes.splice(idx,1);
    activeId = notes.length ? notes[0].id : null;
    renderList();
    renderEditor();
    persist(true);
    deleteBtn.classList.remove('confirm');
    deleteLabel.textContent = 'Delete';
  }

  deleteBtn.addEventListener('click', ()=>{
    if(!notes.find(n=>n.id === activeId)) return;
    if(deleteBtn.classList.contains('confirm')){
      clearTimeout(deleteConfirmTimer);
      deleteActive();
    }else{
      deleteBtn.classList.add('confirm');
      deleteLabel.textContent = 'Sure?';
      deleteConfirmTimer = setTimeout(()=>{
        deleteBtn.classList.remove('confirm');
        deleteLabel.textContent = 'Delete';
      }, 2500);
    }
  });

  titleInput.addEventListener('input', scheduleSave);
  bodyInput.addEventListener('input', scheduleSave);
  search.addEventListener('input', renderList);
  document.getElementById('newNoteBtn').addEventListener('click', newNote);
  document.getElementById('emptyNewBtn').addEventListener('click', newNote);
  document.getElementById('menuToggle').addEventListener('click', ()=> sidebar.classList.toggle('open'));

  document.addEventListener('keydown', (e)=>{
    if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'n'){
      e.preventDefault();
      newNote();
    }
  });

  loadNotes();
})();
</script>
</body>
